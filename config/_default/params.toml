# -- Theme Options (Hextra) --
# https://imfing.github.io/hextra/docs/guide/configuration/

description = "Documentation, guides, API reference and engineering notes from Teramot."
# Default link-preview image (Open Graph / Twitter) for pages without their own.
images = ["brand/og-image.png"]

[navbar]
  displayTitle = false
  displayLogo = true
  [navbar.logo]
    path = "brand/teramot-logo.svg"
    dark = "brand/teramot-logo-on-dark.svg"
    link = "/"
    width = 132
    height = 32

[page]
  # full (100%), wide (90rem), normal (80rem)
  width = "wide"

[theme]
  default = "system"
  displayToggle = true

[footer]
  enable = true
  displayCopyright = true
  displayPoweredBy = false

[search]
  enable = true
  type = "flexsearch"
  [search.flexsearch]
    index = "content"
    tokenize = "forward"

[editURL]
  enable = true
  base = "https://github.com/HalleyScore/teramot-docs/edit/main/content"

displayUpdatedDate = true
dateFormat = "January 2, 2006"

[blog]
  [blog.list]
    displayTags = true
    sortBy = "date"
    sortOrder = "desc"
  [blog.article]
    displayPagination = true

[toc]
  displayTags = true

[highlight]
  [highlight.copy]
    enable = true
    display = "hover"

[imageZoom]
  enable = true

# -- Analytics --
# GoatCounter: cookieless and no personal data. Counts views of blog and
# product-update pages only (layouts/_partials/custom/head-end.html) and shows
# them on each post. Requires "public statistics" enabled in the GoatCounter
# site settings so counts can be read without a token.
[goatcounter]
  code = "teramot"
