#fig-pipeline .capb{fill:var(--tm-blue-ink,var(--tm-blue));font-size:10.5px;font-weight:700;letter-spacing:.09em}
#fig-pipeline .mk{fill:var(--tm-model,#c2410c)}
#fig-pipeline .bk{fill:var(--tm-blue-ink,var(--tm-blue))}
#fig-pipeline .b{font-weight:700}
#fig-pipeline .w{fill:#fff}
#fig-pipeline .base{fill:var(--tm-surface)}
#fig-pipeline .box{fill:currentColor;fill-opacity:.035;stroke:var(--tm-rule-strong);stroke-width:1.25}
#fig-pipeline .code{fill:var(--tm-blue);fill-opacity:.07;stroke:var(--tm-blue);stroke-width:1.75}
#fig-pipeline .codefill{fill:var(--tm-blue)}
#fig-pipeline .model{fill:var(--tm-model,#c2410c);fill-opacity:.1;stroke:var(--tm-model,#c2410c);stroke-width:1.75}
#fig-pipeline .region{fill:var(--tm-blue);fill-opacity:.045;stroke:var(--tm-blue);stroke-opacity:.4;stroke-width:1.25;stroke-dasharray:6 5}
#fig-pipeline .well{fill:currentColor;fill-opacity:.05}
#fig-pipeline .dot{fill:var(--tm-model,#c2410c)}
#fig-pipeline .sq{fill:var(--tm-blue)}
#fig-pipeline .pp{fill:currentColor}
#fig-pipeline .ppm{fill:var(--tm-muted)}
#fig-pipeline .ln{stroke:var(--tm-muted);stroke-width:1.6;fill:none;stroke-linecap:round}
#fig-pipeline .lnb{stroke:var(--tm-blue);stroke-width:2.25;fill:none;stroke-linecap:round}
#fig-pipeline .life{stroke:var(--tm-rule-strong);stroke-width:1.25;stroke-dasharray:3 5;fill:none}
#fig-pipeline .rule{stroke:var(--tm-rule);stroke-width:1;fill:none}
#fig-pipeline .dash{stroke-dasharray:5 5}
#fig-pipeline .ah{fill:var(--tm-muted)}
#fig-pipeline .warn{fill:var(--tm-warn,#b45309)}
#fig-pipeline .bad{fill:var(--tm-bad,#b91c1c)}
#fig-pipeline .good{fill:var(--tm-good,#15803d)}
#fig-pipeline .warnc{fill:var(--tm-warn,#b45309);fill-opacity:.13;stroke:var(--tm-warn,#b45309);stroke-width:1.25}
#fig-pipeline .badc{fill:var(--tm-bad,#b91c1c);fill-opacity:.13;stroke:var(--tm-bad,#b91c1c);stroke-width:1.25}
#fig-pipeline .goodc{fill:var(--tm-good,#15803d);fill-opacity:.13;stroke:var(--tm-good,#15803d);stroke-width:1.25}
#fig-pipeline .mutedc{fill:var(--tm-muted);fill-opacity:.1;stroke:var(--tm-muted);stroke-width:1.25}
#fig-pipeline .warnln{stroke:var(--tm-warn,#b45309);stroke-width:2.25;fill:none;stroke-dasharray:5 4}
</style>
