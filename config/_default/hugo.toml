# -- Site Configuration --
# One Hugo site serves both the documentation and the engineering blog.
# Theme reference: https://imfing.github.io/hextra/docs/guide/configuration/

theme = "hextra"
baseURL = "https://docs.teramot.com/"
title = "Teramot"

# Published docs URLs are mixed-case (/compliance/Policies/...) and must not change.
disablePathToLower = true

enableRobotsTXT = true
enableEmoji = true
# Last-updated dates on docs pages come from git (CI checks out full history).
enableGitInfo = true

buildDrafts = false
buildFuture = false

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    label = "English"
    locale = "en"
    weight = 1
    title = "Teramot"
  [languages.es]
    label = "Español"
    locale = "es"
    weight = 2
    title = "Teramot"

[pagination]
  pagerSize = 20

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"

[permalinks]
  [permalinks.taxonomy]
    authors = "/blog/authors/"
  [permalinks.term]
    authors = "/blog/authors/:contentbasename/"

[outputs]
  home = ["html", "rss", "llms"]
  section = ["html", "rss"]
  page = ["html"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5
