name: Build and deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  # Validate on PRs too: the build is the only thing that catches a broken
  # site before it reaches main, where the next push deploys it.
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  # Rebuild future-dated articles each morning. The scheduled run uses main.
  schedule:
    - cron: "20 12 * * *" # 09:20 America/Argentina/Buenos_Aires

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deployments serialise on one group so they never overlap. PR validation
  # builds deploy nothing, so they get a per-branch group instead and a new
  # push supersedes the run it replaces.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.166.0
  # Hugo shells out to this to render .adoc content (config/_default/markup.toml).
  ASCIIDOCTOR_VERSION: 2.0.26
  # Asciidoctor highlights .adoc code blocks with this.
  ROUGE_VERSION: 5.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o hugo.deb
          sudo dpkg -i hugo.deb

      - name: Install Asciidoctor
        run: |
          sudo gem install asciidoctor -v "${ASCIIDOCTOR_VERSION}" --no-document
          sudo gem install rouge -v "${ROUGE_VERSION}" --no-document

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Test site validator
        run: python3 -m unittest discover -s scripts/tests

      # Always builds for https://docs.teramot.com/ (config/_default/hugo.toml):
      # docs pages link to root paths (/img/..., /compliance/...), so the site
      # only works served from a domain root, never from a github.io subpath.
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --gc --minify

      # Every URL docs.teramot.com ever published must still resolve, and no
      # internal link may be broken.
      - name: Validate published URLs and internal links
        run: python3 scripts/check_site.py public

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    # Pull requests validate the build only; nothing is published until the
    # change is on main.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
