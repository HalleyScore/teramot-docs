# -- Markup --

[goldmark]
  [goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

    [goldmark.parser.attribute]
      block = true

  [goldmark.renderer]
    # Docs pages embed raw HTML (PDF iframes, forms, logo grids).
    unsafe = true

  [goldmark.extensions]
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 4

# -- AsciiDoc --
# Hugo has no built-in AsciiDoc parser: it shells out to the external
# `asciidoctor` binary, which must be installed locally and in CI (see
# .github/workflows/hugo.yml). The binary also has to be allowed in
# config/_default/security.toml.

[asciidocExt]
  # Resolve include:: and image:: relative to the .adoc file, so page bundles
  # (content/blog/<slug>/index.adoc) can reference their own assets.
  workingFolderCurrent = true
  # Let the theme render the TOC from .TableOfContents, as on Markdown pages.
  preserveTOC = false
  # Fail the build on Asciidoctor warnings (unresolved xrefs, missing includes).
  failureLevel = "warn"

  [asciidocExt.attributes]
    # Asciidoctor must build a TOC before Hugo can lift it into .TableOfContents.
    toc = "auto"
    # GitHub-style heading anchors (#my-heading), matching Goldmark's output.
    idprefix = ""
    idseparator = "-"
    # Enable kbd:[], btn:[] and menu:[] macros.
    experimental = ""
    # Chroma never sees AsciiDoc content, so Rouge highlights it. Rouge emits the
    # same Pygments token classes as Chroma; assets/css/custom.css colours them.
    source-highlighter = "rouge"
    rouge-css = "class"
