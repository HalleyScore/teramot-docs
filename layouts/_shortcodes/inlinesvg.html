{{- /* Inline an SVG from assets/ so it inherits the page's ink colour and CSS variables (dark mode included). */ -}}
{{- $src := .Get "src" -}}
{{- $r := resources.Get $src -}}
{{- if not $r -}}{{ errorf "inlinesvg: %q not found under assets/" $src }}{{- end -}}
<figure class="tm-figure{{ with .Get "class" }} {{ . }}{{ end }}">
  <div class="tm-figure-body">{{ $r.Content | safeHTML }}</div>
  {{- with .Get "caption" }}<figcaption>{{ . | markdownify }}</figcaption>{{ end -}}
</figure>
