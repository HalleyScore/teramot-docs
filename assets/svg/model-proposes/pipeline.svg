<svg id="fig-pipeline" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 408" width="100%" role="img" aria-label="From your sources to bronze, silver and gold in fifteen steps: nine are Teramot code, five are a model&#x27;s proposal checked by the loop, and one, the repair after a source change, waits for a person." style="font-family:inherit;font-size:14px;color:inherit">
  <defs>
    <style>#fig-pipeline text{font-family:inherit}
#fig-pipeline .t{fill:currentColor;font-weight:800;font-size:15px;font-family:var(--tm-display,Manrope,ui-sans-serif,system-ui,sans-serif);letter-spacing:-.01em}
#fig-pipeline .s{fill:currentColor;font-size:13px}
#fig-pipeline .m{fill:var(--tm-muted);font-size:12.5px}
#fig-pipeline .mono{fill:currentColor;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#fig-pipeline .cap{fill:var(--tm-muted);font-size:10.5px;font-weight:700;letter-spacing:.09em}
